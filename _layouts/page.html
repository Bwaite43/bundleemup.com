---
layout: compress
---

<!DOCTYPE html>
<html lang="en">
{% include site-head.html %}
<body class="inner">
  {% include site-header.html %}

  <main id="main">
    <div class="page-head">
      <div class="wrap page-head__inner">
        <h1>{{ page.title | markdownify | remove: "<p>" | remove: "</p>" }}</h1>
        {% if page.description %}<p class="page-head__lede">{{ page.description }}</p>{% endif %}
      </div>
    </div>

    <article class="wrap article">
      <div class="prose">
        {{ content }}
      </div>
    </article>
  </main>

  {% include site-footer.html %}
</body>
</html>
